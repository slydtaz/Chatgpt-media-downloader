name: Build Windows EXE (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tool
        shell: cmd
        run: python -m pip install --upgrade pyinstaller
      - name: Run tests
        shell: cmd
        run: python -m unittest discover -s tests -v
      - name: Build single executable
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean ChatGPTMediaDownloader.spec
      - name: Verify EXE and calculate SHA-256
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ChatGPTMediaDownloader.exe')) { throw 'EXE was not created' }
          $hash = (Get-FileHash 'dist/ChatGPTMediaDownloader.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  ChatGPTMediaDownloader.exe" | Out-File -Encoding ascii 'dist/SHA256SUMS.txt'
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatGPTMediaDownloader-Windows-x64
          path: |
            dist/ChatGPTMediaDownloader.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
