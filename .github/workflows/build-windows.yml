name: Build Windows EXE (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install build tool
        shell: cmd
        run: python -m pip install pyinstaller==6.22.3 Pillow==13.0.0
      - name: Run tests
        shell: pwsh
        run: ./tests/run_unittest_ci.ps1
      - name: Build single executable
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean ChatGPTMediaDownloader.spec
      - name: Verify EXE and calculate SHA-256
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ChatGPTMediaDownloader.exe')) { throw 'EXE was not created' }
          $hash = (Get-FileHash 'dist/ChatGPTMediaDownloader.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  ChatGPTMediaDownloader.exe" | Out-File -Encoding ascii 'dist/SHA256SUMS.txt'
      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChatGPTMediaDownloader-Windows-x64
          path: |
            dist/ChatGPTMediaDownloader.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
