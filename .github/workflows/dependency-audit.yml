name: Python dependency vulnerability audit

on:
  push:
    branches: [main, master, 'beta/**', 'ui/**']
  pull_request:
    branches: [main, master, 'beta/**', 'ui/**']
  schedule:
    - cron: '31 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-build-dependencies:
    name: Audit pinned Windows packaging dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned audit tool
        run: python -m pip install pip-audit==2.10.1
      - name: Audit application build dependency tree
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/app-build-requirements.txt" <<'EOF'
          pyinstaller==6.22.3
          Pillow==13.0.0
          EOF
          pip-audit --strict --progress-spinner off --requirement "$RUNNER_TEMP/app-build-requirements.txt"
