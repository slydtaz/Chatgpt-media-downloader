name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'
      - stable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read application version
        shell: pwsh
        run: |
          $match = Select-String -Path 'app/config.py' -Pattern '^VERSION\s*=\s*"([^"]+)"'
          if (!$match) { throw 'Could not read VERSION from app/config.py' }
          $version = $match.Matches[0].Groups[1].Value
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build tool
        shell: cmd
        run: python -m pip install --upgrade pyinstaller
      - name: Compile source
        shell: cmd
        run: python -c "from pathlib import Path; import py_compile; files = list(Path('app').glob('*.py')) + [Path('packaged_entry.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      - name: Run tests before packaging
        shell: cmd
        run: python -m unittest discover -s tests -v
      - name: Build EXE
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean ChatGPTMediaDownloader.spec
      - name: Validate output and create checksum
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ChatGPTMediaDownloader.exe')) { throw 'EXE was not created' }
          $hash = (Get-FileHash 'dist/ChatGPTMediaDownloader.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  ChatGPTMediaDownloader.exe" | Out-File -Encoding ascii 'dist/SHA256SUMS.txt'
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ChatGPT Media Downloader ${{ env.APP_VERSION }} — Stable
          body: |
            Stable release ${{ env.APP_VERSION }}

            **Recommended for users:** download `ChatGPTMediaDownloader.exe`.
            `SHA256SUMS.txt` contains the SHA-256 checksum of the same build.
            Source archives are intended for developers, auditing and compilation.
          make_latest: true
          overwrite_files: true
          files: |
            dist/ChatGPTMediaDownloader.exe
            dist/SHA256SUMS.txt
