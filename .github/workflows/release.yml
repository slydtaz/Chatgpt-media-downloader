name: Build and publish Windows release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      hotfix_number:
        description: "Número do hotfix crítico (deixe vazio para stable normal)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    if: "${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish ChatGPT Media Downloader')) }}"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read application version
        shell: pwsh
        env:
          HOTFIX_NUMBER: ${{ inputs.hotfix_number }}
        run: |
          $match = Select-String -Path 'app/config.py' -Pattern '^VERSION\s*=\s*"([^"]+)"'
          if (!$match) { throw 'Could not read VERSION from app/config.py' }
          $version = $match.Matches[0].Groups[1].Value
          $refName = $env:GITHUB_REF_NAME
          $releaseTag = "v$version"
          if (-not [string]::IsNullOrWhiteSpace($refName) -and $refName -match '^v\d+\.\d+\.\d+$') {
            $releaseTag = $refName
          }
          $hotfixNumber = $env:HOTFIX_NUMBER
          if ([string]::IsNullOrWhiteSpace($hotfixNumber) -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $commitSubject = git log -1 --format=%s
            if ($commitSubject -match '\(hotfix-([1-9]\d*)\)') {
              $hotfixNumber = $Matches[1]
            }
          }
          if ([string]::IsNullOrWhiteSpace($hotfixNumber)) {
            $releaseName = "$version - stable"
          } else {
            if ($hotfixNumber -notmatch '^[1-9]\d*$') { throw 'hotfix_number deve ser um número inteiro positivo.' }
            $releaseName = "$version - stable (hotfix-$hotfixNumber)"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build tool
        shell: cmd
        run: python -m pip install --upgrade pyinstaller
      - name: Compile source
        shell: cmd
        run: python -c "from pathlib import Path; import py_compile; files = list(Path('app').glob('*.py')) + [Path('packaged_entry.py'), Path('emergency_uninstaller.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      - name: Run tests before packaging
        shell: pwsh
        run: ./tests/run_unittest_ci.ps1
      - name: Build EXE
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean ChatGPTMediaDownloader.spec
      - name: Smoke-test packaged GUI (no downloads or update checks)
        shell: pwsh
        run: |
          & '.\\dist\\ChatGPTMediaDownloader.exe' --smoke-test-gui
          if ($LASTEXITCODE -ne 0) { throw "GUI smoke test failed with exit code $LASTEXITCODE." }
      - name: Build standalone emergency uninstaller
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name GPT-Media-Uninstaller --distpath dist-uninstaller --workpath build/uninstaller emergency_uninstaller.py
          if not exist "dist-uninstaller\\GPT-Media-Uninstaller.exe" exit /b 1
          copy /y "dist-uninstaller\\GPT-Media-Uninstaller.exe" "dist\\GPT-Media-Uninstaller.exe"
      - name: Sign EXE with Authenticode when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $exe = 'dist/ChatGPTMediaDownloader.exe'
          $statusFile = 'dist/Windows-Signature-Status.txt'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            $status = @(
              'Authenticode: UNSIGNED'
              'Windows version information is descriptive metadata, not a publisher signature.'
              'A valid code-signing certificate must be configured by the repository owner.'
            ) -join [Environment]::NewLine
            Set-Content -LiteralPath $statusFile -Value $status -Encoding ascii
            Write-Warning 'No trusted code-signing certificate configured. The EXE will remain unsigned.'
          } else {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
              throw 'WINDOWS_SIGNING_CERT_PASSWORD must be configured when a signing certificate is provided.'
            }
            $pfxPath = Join-Path $env:RUNNER_TEMP 'windows-code-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
              $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
              $sdkRoot = Join-Path $programFilesX86 'Windows Kits/10/bin'
              $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq 'x64' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if (!$signTool) { throw 'SignTool x64 was not found in the installed Windows SDK.' }
              & $signTool.FullName sign /fd SHA256 /td SHA256 /tr 'http://timestamp.digicert.com' /f $pfxPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $exe
              if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed with exit code $LASTEXITCODE." }
              & $signTool.FullName verify /pa /v $exe
              if ($LASTEXITCODE -ne 0) { throw "SignTool signature verification failed with exit code $LASTEXITCODE." }
              $status = 'Authenticode: SIGNED; SignTool verification succeeded. SmartScreen may still warn while reputation develops.'
              Set-Content -LiteralPath $statusFile -Value $status -Encoding ascii
            } finally {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Package versioned source ZIP
        shell: pwsh
        run: |
          $sourceZip = "dist/ChatGPTMediaDownloader-$env:APP_VERSION-source.zip"
          $listedTag = git tag --list "$env:RELEASE_TAG"
          $archiveRef = if ($listedTag -eq $env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_SHA }
          git archive --format=zip --output=$sourceZip $archiveRef
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $sourceZip)) { throw 'Source ZIP was not created' }
      - name: Validate output and create checksum
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ChatGPTMediaDownloader.exe')) { throw 'EXE was not created' }
          if (!(Test-Path 'dist/GPT-Media-Uninstaller.exe')) { throw 'GPT Media Uninstaller was not created' }
          if (!(Test-Path 'dist/Windows-Signature-Status.txt')) { throw 'Signature status was not created' }
          $hash = (Get-FileHash 'dist/ChatGPTMediaDownloader.exe' -Algorithm SHA256).Hash.ToLower()
          "$hash  ChatGPTMediaDownloader.exe" | Out-File -Encoding ascii 'dist/SHA256SUMS.txt'
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ${{ env.RELEASE_NAME }}

            Esta é a versão oficial estável ${{ env.APP_VERSION }}. O título só inclui `(hotfix-N)` quando a entrada manual declara uma correção crítica urgente.

            Recommended for users: download ChatGPTMediaDownloader.exe.
            SHA256SUMS.txt contains the SHA-256 checksum of the same build.
            Windows-Signature-Status.txt records whether Authenticode signing was configured and verified.
            GPT-Media-Uninstaller.exe is a standalone emergency cleanup tool; downloaded media are preserved by default.
            The attached source ZIP is intended for developers, auditing and compilation.
          make_latest: true
          overwrite_files: true
          files: |
            dist/ChatGPTMediaDownloader.exe
            dist/GPT-Media-Uninstaller.exe
            dist/SHA256SUMS.txt
            dist/Windows-Signature-Status.txt
            dist/*-source.zip
