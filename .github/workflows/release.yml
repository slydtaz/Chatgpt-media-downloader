name: Build and publish Windows release

on:
  push:
    branches:
      - main
      - 'beta/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      hotfix_number:
        description: "Número do hotfix crítico (deixe vazio para stable normal)"
        required: false
        type: string

permissions: {}

jobs:
  release:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
          || (github.ref_type == 'tag' && !contains(github.ref_name, '-alpha.') && !contains(github.ref_name, '-beta.') && !contains(github.ref_name, '-rc.'))
          || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish ChatGPT Media Downloader'))
          || startsWith(github.ref, 'refs/heads/beta/') }}
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read application version
        shell: pwsh
        env:
          HOTFIX_NUMBER: ${{ inputs.hotfix_number }}
        run: |
          $match = Select-String -Path 'app/config.py' -Pattern '^VERSION\s*=\s*"([^"]+)"'
          if (!$match) { throw 'Could not read VERSION from app/config.py' }
          $version = $match.Matches[0].Groups[1].Value
          $refName = $env:GITHUB_REF_NAME
          $releaseTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($refName -notmatch '^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') {
              throw "Release tag '$refName' is not a semantic version or prerelease tag."
            }
            if ($refName -ne $releaseTag) {
              throw "Release tag '$refName' does not match application version '$releaseTag'."
            }
            $releaseTag = $refName
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Manual releases must run from main.'
          }

          $hotfixNumber = $env:HOTFIX_NUMBER
          if ([string]::IsNullOrWhiteSpace($hotfixNumber) -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $commitSubject = git log -1 --format=%s
            if ($commitSubject -match '\(hotfix-([1-9]\d*)\)') {
              $hotfixNumber = $Matches[1]
            }
          }
          $isPrerelease = $version -match '(?i)-(alpha|beta|rc)\.\d+$'
          if ($env:GITHUB_REF -like 'refs/heads/beta/*') {
            if (!$isPrerelease) { throw 'Beta branches must use an alpha/beta/rc version suffix.' }
            $branchVersion = $refName -replace '^beta/', ''
            if ($branchVersion -ne $version) {
              throw "Beta branch '$refName' must match VERSION '$version' after the beta/ prefix."
            }
          }

          if ($isPrerelease) {
            $releaseName = "$version - beta"
            $releaseIsPrerelease = 'true'
            $channelDescription = 'PRÉ-RELEASE BETA: consulte VirusTotal-Status.txt; podem existir detecções e o executável pode estar sem assinatura Authenticode. Não é uma versão estável.'
          } else {
            if ([string]::IsNullOrWhiteSpace($hotfixNumber)) {
              $releaseName = "$version - stable"
            } else {
              if ($hotfixNumber -notmatch '^[1-9]\d*$') { throw 'hotfix_number deve ser um número inteiro positivo.' }
              $releaseName = "$version - stable (hotfix-$hotfixNumber)"
            }
            $releaseIsPrerelease = 'false'
            $channelDescription = 'Esta é uma versão estável publicada após as verificações de compilação, assinatura e análise de segurança.'
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_IS_PRERELEASE=$releaseIsPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_CHANNEL_DESCRIPTION=$channelDescription" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build tool
        shell: cmd
        run: python -m pip install pyinstaller==6.22.3 Pillow==13.0.0
      - name: Compile source
        shell: cmd
        run: python -c "from pathlib import Path; import py_compile; files = list(Path('app').glob('*.py')) + [Path('packaged_entry.py'), Path('emergency_uninstaller.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      - name: Run tests before packaging
        shell: pwsh
        run: ./tests/run_unittest_ci.ps1
      - name: Prepare Windows application icon
        shell: cmd
        run: python -c "from PIL import Image; Image.open(r'assets\\app-icon.png').save(r'assets\\app-icon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64)])"
      - name: Build EXE
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean ChatGPTMediaDownloader.spec
      - name: Smoke-test packaged GUI (no downloads or update checks)
        shell: pwsh
        run: |
          $env:CGMD_SMOKE_LOG = Join-Path (Get-Location).Path 'dist\gui-smoke.log'
          $process = Start-Process -FilePath '.\dist\ChatGPTMediaDownloader.exe' -ArgumentList '--smoke-test-gui' -PassThru -Wait
          if (Test-Path $env:CGMD_SMOKE_LOG) { Get-Content -LiteralPath $env:CGMD_SMOKE_LOG | Write-Host }
          if ($process.ExitCode -ne 0) { throw "GUI smoke test failed with exit code $($process.ExitCode)." }
          if (!(Test-Path $env:CGMD_SMOKE_LOG)) { throw 'GUI smoke test did not write its report.' }
      - name: Build standalone emergency uninstaller
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --icon assets/app-icon.ico --version-file windows_uninstaller_version_info.txt --name GPT-Media-Uninstaller --distpath dist-uninstaller --workpath build/uninstaller emergency_uninstaller.py
          if not exist "dist-uninstaller\GPT-Media-Uninstaller.exe" exit /b 1
          copy /y "dist-uninstaller\GPT-Media-Uninstaller.exe" "dist\GPT-Media-Uninstaller.exe"
      - name: Sign EXE with Authenticode when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $exe = 'dist/ChatGPTMediaDownloader.exe'
          $uninstaller = 'dist/GPT-Media-Uninstaller.exe'
          $statusFile = 'dist/Windows-Signature-Status.txt'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            $status = @(
              'Authenticode: UNSIGNED (application and emergency uninstaller)'
              'Windows version information is descriptive metadata, not a publisher signature.'
              'A valid code-signing certificate must be configured by the repository owner.'
            ) -join [Environment]::NewLine
            Set-Content -LiteralPath $statusFile -Value $status -Encoding ascii
            Write-Warning 'No trusted code-signing certificate configured. The EXE will remain unsigned.'
          } else {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
              throw 'WINDOWS_SIGNING_CERT_PASSWORD must be configured when a signing certificate is provided.'
            }
            $pfxPath = Join-Path $env:RUNNER_TEMP 'windows-code-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
              $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
              $sdkRoot = Join-Path $programFilesX86 'Windows Kits/10/bin'
              $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq 'x64' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if (!$signTool) { throw 'SignTool x64 was not found in the installed Windows SDK.' }
              foreach ($target in @($exe, $uninstaller)) {
                & $signTool.FullName sign /fd SHA256 /td SHA256 /tr 'http://timestamp.digicert.com' /f $pfxPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $target
                if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed for $target with exit code $LASTEXITCODE." }
                & $signTool.FullName verify /pa /v $target
                if ($LASTEXITCODE -ne 0) { throw "SignTool signature verification failed for $target with exit code $LASTEXITCODE." }
              }
              $status = 'Authenticode: SIGNED; verification succeeded for application and emergency uninstaller. SmartScreen may still warn while reputation develops.'
              Set-Content -LiteralPath $statusFile -Value $status -Encoding ascii
            } finally {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Package versioned source ZIP
        shell: pwsh
        run: |
          $sourceZip = "dist/ChatGPTMediaDownloader-$env:APP_VERSION-source.zip"
          $listedTag = git tag --list "$env:RELEASE_TAG"
          $archiveRef = if ($listedTag -eq $env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_SHA }
          git archive --format=zip --output=$sourceZip $archiveRef
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $sourceZip)) { throw 'Source ZIP was not created' }
      - name: Stage runtime dependencies for VirusTotal review
        shell: pwsh
        run: |
          python scripts/stage_runtime_dependencies_for_scan.py
      - name: Scan app, source and runtime dependencies with VirusTotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $sourceZip = Get-ChildItem -LiteralPath 'dist' -Filter '*-source.zip' | Select-Object -First 1
          if (!$sourceZip) { throw 'Versioned source ZIP is missing; cannot complete VirusTotal inventory.' }
          $scanInputs = 'dist/security-scan-inputs'
          $targets = @(
            "ChatGPTMediaDownloader.exe=dist/ChatGPTMediaDownloader.exe",
            "GPT-Media-Uninstaller.exe=dist/GPT-Media-Uninstaller.exe",
            "$($sourceZip.Name)=$($sourceZip.FullName)",
            "yt-dlp.exe=$scanInputs/yt-dlp.exe",
            "ffmpeg.exe=$scanInputs/ffmpeg.exe",
            "ffprobe.exe=$scanInputs/ffprobe.exe"
          )
          $arguments = @('scripts/virus_total_scan.py', '--report', 'dist/VirusTotal-Status.txt', '--metadata', 'dist/Security-Inventory.txt')
          foreach ($target in $targets) { $arguments += @('--target', $target) }
          python @arguments
          if ($LASTEXITCODE -ne 0) { throw 'VirusTotal scan incomplete or failed; refusing to publish a beta without a complete report.' }
      - name: Preserve VirusTotal report for inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal-report-${{ github.run_id }}
          path: dist/VirusTotal-Status.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce beta/stable publication policy
        shell: pwsh
        run: |
          $isPrerelease = $env:RELEASE_IS_PRERELEASE -eq 'true'
          $signaturePath = 'dist/Windows-Signature-Status.txt'
          $scanPath = 'dist/VirusTotal-Status.txt'
          $inventoryPath = 'dist/Security-Inventory.txt'
          if (!(Test-Path -LiteralPath $signaturePath)) { throw 'Missing Authenticode status; refusing to publish.' }
          if (!(Test-Path -LiteralPath $scanPath)) { throw 'Missing VirusTotal report; refusing to publish.' }
          if (!(Test-Path -LiteralPath $inventoryPath)) { throw 'Missing runtime security inventory; refusing to publish.' }
          $signature = Get-Content -LiteralPath $signaturePath -Raw
          $scan = Get-Content -LiteralPath $scanPath -Raw
          if ($scan -match '(?m)^(NOT SCANNED|SCAN ERROR|ANALYSIS PENDING|OVERALL: SCAN ERROR|OVERALL: ANALYSIS PENDING)') {
            throw 'Release blocked: VirusTotal results are absent, incomplete, or erroneous.'
          }
          if ($scan -notmatch '(?m)^ANALYSIS COMPLETE:\s*6/6 targets\s*$') {
            throw 'Release blocked: all six required VirusTotal samples must finish analysis.'
          }
          $required = @('ChatGPTMediaDownloader.exe','GPT-Media-Uninstaller.exe','yt-dlp.exe','ffmpeg.exe','ffprobe.exe')
          foreach ($sample in $required) {
            if ($scan -notmatch [regex]::Escape("RESULT: $sample;")) {
              throw "Release blocked: missing completed scan for $sample."
            }
          }
          $sourceZip = Get-ChildItem -LiteralPath 'dist' -Filter '*-source.zip' | Select-Object -First 1
          if (!$sourceZip -or $scan -notmatch [regex]::Escape("RESULT: $($sourceZip.Name);")) {
            throw 'Release blocked: missing completed scan for the exact source ZIP.'
          }
          $hasFindings = $scan -match '(?m)^RESULT: .*malicious=[1-9]\d*' -or $scan -match '(?m)^RESULT: .*suspicious=[1-9]\d*'
          if ($isPrerelease) {
            if ($hasFindings) {
              Write-Warning 'BETA RELEASE: VirusTotal detections were found. They are documented in the attached report and have not been declared false positives.'
            } else {
              Write-Host 'BETA RELEASE: completed VirusTotal report returned zero malicious/suspicious detections.'
            }
            if ($signature -notmatch '(?m)^Authenticode: SIGNED;') {
              Write-Warning 'BETA RELEASE: no verified trusted Authenticode signature; Windows may show an unknown-publisher/SmartScreen warning or block this binary under Smart App Control or organizational policy.'
            }
            Write-Host 'Only a pre-release is allowed to proceed without clean scans/signature; the stable-release gate remains strict.'
          } else {
            if ($signature -notmatch '(?m)^Authenticode: SIGNED;') {
              throw 'Stable release blocked: configure a valid trusted Authenticode certificate.'
            }
            if ($hasFindings) {
              throw 'Stable release blocked: one or more VirusTotal samples have malicious/suspicious detections.'
            }
            Write-Host 'Stable trust gates passed: trusted Authenticode verified, and all six VirusTotal scans completed with zero malicious/suspicious detections.'
          }
      - name: Validate output and create checksum
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ChatGPTMediaDownloader.exe')) { throw 'EXE was not created' }
          if (!(Test-Path 'dist/GPT-Media-Uninstaller.exe')) { throw 'GPT Media Uninstaller was not created' }
          if (!(Test-Path 'dist/Windows-Signature-Status.txt')) { throw 'Signature status was not created' }
          $sourceZip = Get-ChildItem -LiteralPath 'dist' -Filter '*-source.zip' | Select-Object -First 1
          if (!$sourceZip) { throw 'Source ZIP is missing when generating release checksums.' }
          $checksumTargets = @(
            'dist/ChatGPTMediaDownloader.exe',
            'dist/GPT-Media-Uninstaller.exe',
            $sourceZip.FullName,
            'dist/Windows-Signature-Status.txt',
            'dist/VirusTotal-Status.txt',
            'dist/Security-Inventory.txt'
          )
          $checksumLines = foreach ($path in $checksumTargets) {
            if (!(Test-Path -LiteralPath $path)) { throw "Cannot checksum missing release file: $path" }
            $item = Get-Item -LiteralPath $path
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($item.Name)"
          }
          $checksumLines | Out-File -Encoding ascii 'dist/SHA256SUMS.txt'
      - name: Generate GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ChatGPTMediaDownloader.exe
            dist/GPT-Media-Uninstaller.exe
            dist/*-source.zip
            dist/SHA256SUMS.txt
            dist/Windows-Signature-Status.txt
            dist/VirusTotal-Status.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ${{ env.RELEASE_NAME }}

            ${{ env.RELEASE_CHANNEL_DESCRIPTION }} Versão: ${{ env.APP_VERSION }}.

            BETA / PRÉ-RELEASE: this build is published for controlled community review, not as a stable or certified release.
            VirusTotal-Status.txt lists per-engine results for the app, uninstaller, source ZIP, and exact yt-dlp/FFmpeg/FFprobe binaries used by the app.
            If that report says REVIEW REQUIRED or lists detections, do not assume those are false positives; inspect each vendor result before running the file.
            Windows-Signature-Status.txt records whether trusted Authenticode signing was verified. This beta may be unsigned; Windows may show a warning or block it under Smart App Control/policy.
            SHA256SUMS.txt covers the release binaries, source ZIP, signature status, scan report, and security inventory. Verify each file against this manifest.
            Runtime dependency binaries in Security-Inventory.txt were scanned from official upstream releases but are not bundled with this application. The source ZIP is intended for developers, auditing, and compilation.
          prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.RELEASE_IS_PRERELEASE != 'true' }}
          overwrite_files: true
          files: |
            dist/ChatGPTMediaDownloader.exe
            dist/GPT-Media-Uninstaller.exe
            dist/SHA256SUMS.txt
            dist/Windows-Signature-Status.txt
            dist/VirusTotal-Status.txt
            dist/Security-Inventory.txt
            dist/*-source.zip