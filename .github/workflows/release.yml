name: Build and publish Windows release

on:
  push:
    branches:
      - main
      - 'beta/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      hotfix_number:
        description: "Número do hotfix crítico (deixe vazio para stable normal)"
        required: false
        type: string

permissions: {}

jobs:
  release:
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
          || github.ref_type == 'tag'
          || (github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'release: publish ChatGPT Media Downloader')) }}
          || startsWith(github.ref, 'refs/heads/beta/')
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Read application version
        shell: pwsh
        env:
          HOTFIX_NUMBER: ${{ inputs.hotfix_number }}
        run: |
          $match = Select-String -Path 'app/config.py' -Pattern '^VERSION\s*=\s*"([^"]+)"'
          if (!$match) { throw 'Could not read VERSION from app/config.py' }
          $version = $match.Matches[0].Groups[1].Value
          $refName = $env:GITHUB_REF_NAME
          $releaseTag = "v$version"
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($refName -notmatch '^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') {
              throw "Release tag '$refName' is not a semantic version tag."
            }
            if ($refName -ne $releaseTag) {
              throw "Release tag '$refName' does not match application version '$releaseTag'."
            }
            $releaseTag = $refName
          }
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch' -and $env:GITHUB_REF -ne 'refs/heads/main') {
            throw 'Manual releases must run from main.'
          }

          $hotfixNumber = $env:HOTFIX_NUMBER
          if ([string]::IsNullOrWhiteSpace($hotfixNumber) -and $env:GITHUB_REF -eq 'refs/heads/main') {
            $commitSubject = git log -1 --format=%s
            if ($commitSubject -match '\(hotfix-([1-9]\d*)\)') {
              $hotfixNumber = $Matches[1]
            }
          }
          $isPrerelease = $version -match '(?i)-(alpha|beta|rc)\.\d+$'
          if ($env:GITHUB_REF -like 'refs/heads/beta/*') {
            if (!$isPrerelease) { throw 'Beta branches must use an alpha/beta/rc version suffix.' }
            $branchVersion = $refName -replace '^beta/', ''
            if ($branchVersion -ne $version) {
              throw "Beta branch '$refName' must match VERSION '$version' after the beta/ prefix."
            }
          }

          if ($isPrerelease) {
            $releaseName = "$version - beta"
            $releaseIsPrerelease = 'true'
            $channelDescription = 'Esta é uma pré-release beta para testes; não é recomendada para uso estável.'
          } else {
            if ([string]::IsNullOrWhiteSpace($hotfixNumber)) {
              $releaseName = "$version - stable"
            } else {
              if ($hotfixNumber -notmatch '^[1-9]\d*$') { throw 'hotfix_number deve ser um número inteiro positivo.' }
              $releaseName = "$version - stable (hotfix-$hotfixNumber)"
            }
            $releaseIsPrerelease = 'false'
            $channelDescription = 'Esta é uma versão estável publicada após as verificações de compilação, assinatura e análise de segurança.'
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_IS_PRERELEASE=$releaseIsPrerelease" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_CHANNEL_DESCRIPTION=$channelDescription" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install build tool
        shell: cmd
        run: python -m pip install pyinstaller==6.22.3 Pillow==13.0.0
      - name: Compile source
        shell: cmd
        run: python -c "from pathlib import Path; import py_compile; files = list(Path('app').glob('*.py')) + [Path('packaged_entry.py'), Path('emergency_uninstaller.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      - name: Run tests before packaging
        shell: pwsh
        run: ./tests/run_unittest_ci.ps1
      - name: Build EXE
        shell: cmd
        run: python -m PyInstaller --noconfirm --clean ChatGPTMediaDownloader.spec
      - name: Smoke-test packaged GUI (no downloads or update checks)
        shell: pwsh
        run: |
          $env:CGMD_SMOKE_LOG = Join-Path (Get-Location).Path 'dist\gui-smoke.log'
          $process = Start-Process -FilePath '.\dist\ChatGPTMediaDownloader.exe' -ArgumentList '--smoke-test-gui' -PassThru -Wait
          if (Test-Path $env:CGMD_SMOKE_LOG) { Get-Content -LiteralPath $env:CGMD_SMOKE_LOG | Write-Host }
          if ($process.ExitCode -ne 0) { throw "GUI smoke test failed with exit code $($process.ExitCode)." }
          if (!(Test-Path $env:CGMD_SMOKE_LOG)) { throw 'GUI smoke test did not write its report.' }
      - name: Build standalone emergency uninstaller
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --noconsole --name GPT-Media-Uninstaller --distpath dist-uninstaller --workpath build/uninstaller emergency_uninstaller.py
          if not exist "dist-uninstaller\GPT-Media-Uninstaller.exe" exit /b 1
          copy /y "dist-uninstaller\GPT-Media-Uninstaller.exe" "dist\GPT-Media-Uninstaller.exe"
      - name: Sign EXE with Authenticode when a trusted certificate is configured
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          $exe = 'dist/ChatGPTMediaDownloader.exe'
          $uninstaller = 'dist/GPT-Media-Uninstaller.exe'
          $statusFile = 'dist/Windows-Signature-Status.txt'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_BASE64)) {
            $status = @(
              'Authenticode: UNSIGNED (application and emergency uninstaller)'
              'Windows version information is descriptive metadata, not a publisher signature.'
              'A valid code-signing certificate must be configured by the repository owner.'
            ) -join [Environment]::NewLine
            Set-Content -LiteralPath $statusFile -Value $status -Encoding ascii
            Write-Warning 'No trusted code-signing certificate configured. The EXE will remain unsigned.'
          } else {
            if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERT_PASSWORD)) {
              throw 'WINDOWS_SIGNING_CERT_PASSWORD must be configured when a signing certificate is provided.'
            }
            $pfxPath = Join-Path $env:RUNNER_TEMP 'windows-code-signing.pfx'
            try {
              [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
              $programFilesX86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
              $sdkRoot = Join-Path $programFilesX86 'Windows Kits/10/bin'
              $signTool = Get-ChildItem -LiteralPath $sdkRoot -Filter 'signtool.exe' -Recurse -ErrorAction SilentlyContinue |
                Where-Object { $_.Directory.Name -eq 'x64' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if (!$signTool) { throw 'SignTool x64 was not found in the installed Windows SDK.' }
              foreach ($target in @($exe, $uninstaller)) {
                & $signTool.FullName sign /fd SHA256 /td SHA256 /tr 'http://timestamp.digicert.com' /f $pfxPath /p $env:WINDOWS_SIGNING_CERT_PASSWORD $target
                if ($LASTEXITCODE -ne 0) { throw "SignTool signing failed for $target with exit code $LASTEXITCODE." }
                & $signTool.FullName verify /pa /v $target
                if ($LASTEXITCODE -ne 0) { throw "SignTool signature verification failed for $target with exit code $LASTEXITCODE." }
              }
              $status = 'Authenticode: SIGNED; verification succeeded for application and emergency uninstaller. SmartScreen may still warn while reputation develops.'
              Set-Content -LiteralPath $statusFile -Value $status -Encoding ascii
            } finally {
              Remove-Item -LiteralPath $pfxPath -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Package versioned source ZIP
        shell: pwsh
        run: |
          $sourceZip = "dist/ChatGPTMediaDownloader-$env:APP_VERSION-source.zip"
          $listedTag = git tag --list "$env:RELEASE_TAG"
          $archiveRef = if ($listedTag -eq $env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:GITHUB_SHA }
          git archive --format=zip --output=$sourceZip $archiveRef
          if ($LASTEXITCODE -ne 0 -or !(Test-Path $sourceZip)) { throw 'Source ZIP was not created' }
      - name: Scan release executables with VirusTotal
        shell: pwsh
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          $statusFile = 'dist/VirusTotal-Status.txt'
          $targets = @('dist/ChatGPTMediaDownloader.exe', 'dist/GPT-Media-Uninstaller.exe')
          if ([string]::IsNullOrWhiteSpace($env:VIRUSTOTAL_API_KEY)) {
            @(
              'VirusTotal: NOT SCANNED'
              'Reason: repository secret VIRUSTOTAL_API_KEY is not configured.'
              'No antivirus verdict is claimed for this build.'
            ) | Set-Content -LiteralPath $statusFile -Encoding utf8
            Write-Warning 'VirusTotal skipped: configure VIRUSTOTAL_API_KEY to enable public executable scanning.'
            exit 0
          }

          $submissions = @()
          $reportLines = @('VirusTotal analysis report', "UTC started: $([DateTime]::UtcNow.ToString('o'))")
          $detectionsFound = $false
          try {
            foreach ($path in $targets) {
              if (!(Test-Path -LiteralPath $path)) { throw "Expected executable not found: $path" }
              $item = Get-Item -LiteralPath $path
              if ($item.Length -gt 32MB) { throw "$($item.Name) exceeds VirusTotal's 32 MiB standard upload limit." }
              $hash = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLower()
              $upload = Invoke-RestMethod -Method Post -Uri 'https://www.virustotal.com/api/v3/files' -Headers @{ 'x-apikey' = $env:VIRUSTOTAL_API_KEY; 'accept' = 'application/json' } -Form @{ file = $item }
              $analysisId = [string]$upload.data.id
              if ([string]::IsNullOrWhiteSpace($analysisId)) { throw "VirusTotal did not return an analysis ID for $($item.Name)." }
              $submissions += [pscustomobject]@{
                Name = $item.Name; Hash = $hash; AnalysisId = $analysisId; Complete = $false
              }
              $reportLines += "$($item.Name): SHA256 $hash; analysis $analysisId"
            }

            # Public API quotas vary. Poll once per minute and never treat a pending scan as clean.
            for ($attempt = 0; $attempt -lt 5; $attempt++) {
              Start-Sleep -Seconds 60
              foreach ($submission in $submissions | Where-Object { -not $_.Complete }) {
                $analysis = Invoke-RestMethod -Method Get -Uri "https://www.virustotal.com/api/v3/analyses/$($submission.AnalysisId)" -Headers @{ 'x-apikey' = $env:VIRUSTOTAL_API_KEY; 'accept' = 'application/json' }
                if ([string]$analysis.data.attributes.status -ne 'completed') { continue }
                $stats = $analysis.data.attributes.stats
                $malicious = [int]($stats.malicious)
                $suspicious = [int]($stats.suspicious)
                $undetected = [int]($stats.undetected)
                $harmless = [int]($stats.harmless)
                $submission.Complete = $true
                $reportLines += "$($submission.Name): malicious=$malicious; suspicious=$suspicious; undetected=$undetected; harmless=$harmless"
                $reportLines += "Report: https://www.virustotal.com/gui/file/$($submission.Hash)/detection"
                if ($malicious -gt 0 -or $suspicious -gt 0) { $detectionsFound = $true }
              }
              if (@($submissions | Where-Object { -not $_.Complete }).Count -eq 0) { break }
            }

            $pending = @($submissions | Where-Object { -not $_.Complete })
            if ($pending.Count -gt 0) {
              $reportLines += 'Result: ANALYSIS PENDING — release must not be published.'
              $reportLines += ($pending | ForEach-Object { "$($_.Name): https://www.virustotal.com/gui/file/$($_.Hash)/detection" })
              $reportLines | Set-Content -LiteralPath $statusFile -Encoding utf8
              throw 'VirusTotal analysis is still pending. Inspect the report and rerun after completion.'
            }
            if ($detectionsFound) {
              $reportLines += 'Result: REVIEW REQUIRED — one or more engines reported malicious or suspicious.'
              $reportLines += 'Release is blocked pending investigation of the vendors and possible false positives.'
            } else {
              $reportLines += 'Result: no malicious or suspicious detections returned at scan time; this does not guarantee safety.'
            }
            $reportLines | Set-Content -LiteralPath $statusFile -Encoding utf8
            if ($detectionsFound) {
              throw 'VirusTotal reported malicious or suspicious detections; release publication is blocked.'
            }
          } catch {
            if (!(Test-Path -LiteralPath $statusFile)) {
              @('VirusTotal: SCAN ERROR', $_.Exception.Message, 'No clean verdict is implied.') | Set-Content -LiteralPath $statusFile -Encoding utf8
            }
            throw
          }
      - name: Preserve VirusTotal report for inspection
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virustotal-report-${{ github.run_id }}
          path: dist/VirusTotal-Status.txt
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce release trust requirements
        shell: pwsh
        run: |
          $signaturePath = 'dist/Windows-Signature-Status.txt'
          $scanPath = 'dist/VirusTotal-Status.txt'
          if (!(Test-Path -LiteralPath $signaturePath)) { throw 'Missing Authenticode status; refusing to publish.' }
          if (!(Test-Path -LiteralPath $scanPath)) { throw 'Missing VirusTotal report; refusing to publish.' }
          $signature = Get-Content -LiteralPath $signaturePath -Raw
          if ($signature -notmatch '(?m)^Authenticode: SIGNED;') {
            throw 'Release blocked: configure a valid trusted Authenticode code-signing certificate.'
          }
          $scan = Get-Content -LiteralPath $scanPath
          if ($scan -match 'NOT SCANNED|SCAN ERROR|ANALYSIS PENDING|REVIEW REQUIRED') {
            throw 'Release blocked: VirusTotal did not provide a completed, acceptable report.'
          }
          $results = @($scan | Where-Object { $_ -match '^(ChatGPTMediaDownloader\.exe|GPT-Media-Uninstaller\.exe): malicious=' })
          if ($results.Count -ne 2) { throw 'Release blocked: no complete VirusTotal result for both executables.' }
          foreach ($row in $results) {
            if ($row -notmatch 'malicious=0; suspicious=0') { throw "Release blocked by antivirus results: $row" }
          }
          Write-Host 'Trust gates passed: Authenticode signature verified and VirusTotal reports completed with zero malicious/suspicious detections.'
      - name: Validate output and create checksum
        shell: pwsh
        run: |
          if (!(Test-Path 'dist/ChatGPTMediaDownloader.exe')) { throw 'EXE was not created' }
          if (!(Test-Path 'dist/GPT-Media-Uninstaller.exe')) { throw 'GPT Media Uninstaller was not created' }
          if (!(Test-Path 'dist/Windows-Signature-Status.txt')) { throw 'Signature status was not created' }
          $hash = (Get-FileHash 'dist/ChatGPTMediaDownloader.exe' -Algorithm SHA256).Hash.ToLower()
          $uninstallerHash = (Get-FileHash 'dist/GPT-Media-Uninstaller.exe' -Algorithm SHA256).Hash.ToLower()
          @("$hash  ChatGPTMediaDownloader.exe", "$uninstallerHash  GPT-Media-Uninstaller.exe") | Out-File -Encoding ascii 'dist/SHA256SUMS.txt'
      - name: Generate GitHub build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/ChatGPTMediaDownloader.exe
            dist/GPT-Media-Uninstaller.exe
            dist/*-source.zip
            dist/SHA256SUMS.txt
            dist/Windows-Signature-Status.txt
            dist/VirusTotal-Status.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ${{ env.RELEASE_NAME }}

            ${{ env.RELEASE_CHANNEL_DESCRIPTION }} Versão: ${{ env.APP_VERSION }}.

            Recommended for users: download ChatGPTMediaDownloader.exe.
            SHA256SUMS.txt contains the SHA-256 checksum of the same build.
            Windows-Signature-Status.txt records whether Authenticode signing was configured and verified.
            VirusTotal-Status.txt records antivirus analysis for both public executables. Publication requires trusted Authenticode and completed scans without malicious/suspicious detections.
            GPT-Media-Uninstaller.exe is a standalone emergency cleanup tool; downloaded media are preserved by default.
            The attached source ZIP is intended for developers, auditing and compilation.
          prerelease: ${{ env.RELEASE_IS_PRERELEASE == 'true' }}
          make_latest: ${{ env.RELEASE_IS_PRERELEASE != 'true' }}
          overwrite_files: true
          files: |
            dist/ChatGPTMediaDownloader.exe
            dist/GPT-Media-Uninstaller.exe
            dist/SHA256SUMS.txt
            dist/Windows-Signature-Status.txt
            dist/VirusTotal-Status.txt
            dist/*-source.zip