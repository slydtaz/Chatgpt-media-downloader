name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source (Windows cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: python -c "from pathlib import Path; import py_compile; files = list(Path('app').glob('*.py')) + [Path('packaged_entry.py'), Path('emergency_uninstaller.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      - name: Compile source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python -c "from pathlib import Path; import py_compile; files = list(Path('app').glob('*.py')) + [Path('packaged_entry.py'), Path('emergency_uninstaller.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      # Run Python without a console so child-process tests cannot interrupt cmd.exe.
      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run_unittest_ci.ps1
      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python -m unittest discover -s tests -v
