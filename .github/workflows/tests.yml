name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source (Windows cmd)
        if: runner.os == 'Windows'
        shell: cmd
        run: python -c "from pathlib import Path; import py_compile; files = list(Path('app').glob('*.py')) + [Path('packaged_entry.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      - name: Compile source (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python -c "from pathlib import Path; import py_compile; files = list(Path('app').glob('*.py')) + [Path('packaged_entry.py')]; [py_compile.compile(str(p), doraise=True) for p in files]"
      # Capture Python stdout/stderr to files and return the actual unittest exit
      # code. This avoids shell-wrapper handling of native stderr.
      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/run_unittest_ci.ps1
      - name: Run unit tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: python -m unittest discover -s tests -v
