name: UI-debug prototype checks

on:
  push:
    branches: [ui-debug]
    paths:
      - "UI-debug/**"
      - ".github/workflows/ui-debug.yml"
  pull_request:
    paths:
      - "UI-debug/**"
      - ".github/workflows/ui-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile standalone UI-debug app
        run: python -m py_compile UI-debug/ui_debug.py
      - name: Run standalone UI-debug tests
        run: python -m unittest discover -s UI-debug/tests -v
