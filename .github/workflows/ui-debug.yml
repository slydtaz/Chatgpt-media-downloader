name: UI-debug prototype checks

on:
  push:
    branches: [ui-debug]
    paths:
      - "UI-debug/**"
      - ".github/workflows/ui-debug.yml"
  pull_request:
    paths:
      - "UI-debug/**"
      - ".github/workflows/ui-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prototype-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile standalone UI-debug app and preview harness
        run: python -m py_compile UI-debug/ui_debug.py UI-debug/capture_preview.py
      - name: Run standalone UI-debug tests
        run: python -m unittest discover -s UI-debug/tests -v


  capture-preview:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install screenshot capture dependency
        run: python -m pip install Pillow==13.0.0
      - name: Capture real UI-debug pages
        run: python UI-debug/capture_preview.py --output ui-debug-preview-output
      - name: Package standalone UI-debug folder (not a release)
        shell: pwsh
        run: |
          $archive = "ui-debug-app-0.1.0-dev.6.zip"
          $packageRoot = Join-Path $env:RUNNER_TEMP "ui-debug-package"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          $files = @(
            "ui_debug.py",
            "version.json",
            "README.md",
            "run_ui_debug.bat",
            "run_ui_debug.sh",
            "capture_preview.py",
            "tests/test_ui_debug.py"
          )
          foreach ($file in $files) {
            $source = Join-Path "UI-debug" $file
            $destination = Join-Path $packageRoot $file
            $parent = Split-Path -Parent $destination
            New-Item -ItemType Directory -Force -Path $parent | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination
          }
          Compress-Archive -Path (Join-Path $packageRoot "*") -DestinationPath $archive -Force
          if (!(Test-Path -LiteralPath $archive)) { throw "The standalone UI-debug archive was not created." }
      - name: Upload standalone UI-debug package (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-debug-app-0.1.0-dev.6
          path: ui-debug-app-0.1.0-dev.6.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload visual review artifact (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-debug-preview-0.1.0-dev.6
          path: ui-debug-preview-output/
          if-no-files-found: error
          retention-days: 14
