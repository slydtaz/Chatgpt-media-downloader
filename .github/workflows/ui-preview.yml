name: Capture real application UI preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "ui/**"
    paths:
      - ".github/workflows/ui-preview.yml"
      - "tools/capture_ui_preview.py"
      - "app/gui.py"
      - "app/config.py"
      - "app/media_preview.py"
      - "app/playlist.py"
      - "ChatGPTMediaDownloader.spec"
  pull_request:
    paths:
      - ".github/workflows/ui-preview.yml"
      - "tools/capture_ui_preview.py"
      - "app/gui.py"
      - "app/config.py"

permissions:
  contents: read

jobs:
  capture-ui:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install screenshot capture dependency
        shell: pwsh
        run: python -m pip install Pillow==13.0.0
      - name: Capture actual UI tabs, automatic media preview panel, and animations
        shell: pwsh
        run: python tools/capture_ui_preview.py --output ui-preview-output
      - name: Upload screenshots and animations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chatgpt-media-downloader-ui-preview-5.3.2
          path: ui-preview-output/
          if-no-files-found: error
          retention-days: 14
